name: Release DMG

# Publish the distributable .dmg to the GitHub Releases section of Vision for macOS's
# home, https://github.com/phastings503cm/vision-mac (the README, the release notes and
# the app's download links all point there).
#
# The version is read from the app bundle's Info.plist (CFBundleShortVersionString),
# so it stays in lockstep with bundle.sh. Tag a commit as v<version> (e.g. v0.16.0)
# and push the tag to that repository — the matching release is created (or re-created
# on re-tag) automatically. A tag pushed to any other copy of the repository (a fork,
# the old home) publishes nothing.
#
#   1. Bump CFBundleShortVersionString (and CFBundleVersion) in bundle.sh.
#   2. git tag v0.16.0 && git push vision v0.16.0   (vision = phastings503cm/vision-mac)
#   3. This workflow builds the DMG and publishes the release.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    # Releases are published only from Vision for macOS's home repository.
    if: github.repository == 'phastings503cm/vision-mac'
    # arm64 runner (matches the Apple Silicon build). The default Xcode 16
    # toolchain is Swift 6, which is what the package requires
    # (swift-tools-version 6.0 in Package.swift).
    runs-on: macos-15
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          # Full history so "what changed since the last release" can be
          # computed with git describe + git log.
          fetch-depth: 0

      # Every release is signed with the same self-signed certificate ("Vision Release Signing"), so the
      # app's designated requirement — identifier + certificate root — is the same in every version and
      # macOS keeps Screen Recording / Accessibility / Automation grants across updates. (Ad-hoc builds,
      # up to 0.16.7, changed identity every release and lost them.) The certificate lives in the repo
      # secrets; there is no fallback to ad-hoc signing.
      - name: Import the release signing certificate
        env:
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
        run: |
          set -euo pipefail
          if [ -z "$MACOS_CERTIFICATE_P12" ] || [ -z "$MACOS_CERTIFICATE_PASSWORD" ] || [ -z "$MACOS_SIGN_IDENTITY" ]; then
            echo "::error::The release signing certificate secrets are missing; refusing to ship an ad-hoc build."
            exit 1
          fi
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          echo "$MACOS_CERTIFICATE_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          # codesign only finds an identity in a keychain on the search list (and it has to be there before
          # the import); --keychain alone gives "The specified item could not be found in the keychain".
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          rm "$RUNNER_TEMP/cert.p12"
          echo "SIGN_IDENTITY=$MACOS_SIGN_IDENTITY" >> "$GITHUB_ENV"
          echo "SIGN_KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"

      - name: Build the app bundle + DMG
        env:
          # SHA-1 of the "Vision Release Signing" certificate. bundle.sh fails if the app's designated
          # requirement names any other root — a new certificate would break every user's grants again.
          EXPECT_CERT_ROOT: 4c89dadbc2386ca4aac2f8b8f27790cb673ef7a6
        run: bash bundle.sh release

      - name: Remove the signing keychain
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/signing.keychain-db" 2>/dev/null || true

      - name: Read version from Info.plist
        id: meta
        run: |
          set -euo pipefail
          SHORT="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' build/Vision.app/Contents/Info.plist)"
          # Pad a short version ("0.4") up to a full dotted one ("0.4.0").
          IFS=. read -r major minor patch <<<"$SHORT"
          major="${major:-0}"; minor="${minor:-0}"; patch="${patch:-0}"
          FULL="$major.$minor.$patch"
          # The release API rejects a *tag name* as target_commitish on this
          # repo, so point it at the peeled commit the tag refers to.
          TARGET="$(git rev-parse "${GITHUB_REF#refs/tags/}^{}")"
          echo "full=$FULL" >> "$GITHUB_OUTPUT"
          echo "tag=v$FULL"   >> "$GITHUB_OUTPUT"
          echo "title=Vision for macOS v$FULL" >> "$GITHUB_OUTPUT"
          echo "target=$TARGET" >> "$GITHUB_OUTPUT"

      - name: Keep the DMG as an artifact
        uses: actions/upload-artifact@v4
        with:
          name: Vision-macOS-${{ steps.meta.outputs.tag }}
          path: build/Vision.dmg
          if-no-files-found: error

      - name: Create / update the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${{ steps.meta.outputs.tag }}"
          # Re-runnable: drop any existing release for this tag (keep the tag,
          # which --target below requires).
          gh release delete "$TAG" --yes 2>/dev/null || true
          # Append "what changed" — the commits since the previous release tag.
          PREV="$(git describe --tags --abbrev=0 "$TAG^" 2>/dev/null || true)"
          NOTES="$(mktemp)"
          cp .github/release_notes.md "$NOTES"
          if [ -n "$PREV" ]; then
            {
              printf '\n## What changed since %s\n\n' "$PREV"
              git log --no-decorate --pretty='- %h %s' "$PREV..$TAG" | sed 's/^/  /'
            } >> "$NOTES"
          fi
          gh release create "$TAG" \
            --title "${{ steps.meta.outputs.title }}" \
            --target "${{ steps.meta.outputs.target }}" \
            --notes-file "$NOTES" \
            build/Vision.dmg
