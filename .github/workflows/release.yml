name: Release DMG

# Publish the distributable .dmg to the GitHub Releases section of Vision for macOS's
# home, https://github.com/phastings503cm/vision-mac (the README, the release notes and
# the app's download links all point there).
#
# The version is read from the app bundle's Info.plist (CFBundleShortVersionString),
# so it stays in lockstep with bundle.sh. Tag a commit as v<version> (e.g. v0.16.0)
# and push the tag to that repository — the matching release is created (or re-created
# on re-tag) automatically. A tag pushed to any other copy of the repository (a fork,
# the old home) publishes nothing.
#
#   1. Bump CFBundleShortVersionString (and CFBundleVersion) in bundle.sh.
#   2. git tag v0.16.0 && git push vision v0.16.0   (vision = phastings503cm/vision-mac)
#   3. This workflow builds the DMG and publishes the release.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    # Releases are published only from Vision for macOS's home repository.
    if: github.repository == 'phastings503cm/vision-mac'
    # arm64 runner (matches the Apple Silicon build). The default Xcode 16
    # toolchain is Swift 6, which is what the package requires
    # (swift-tools-version 6.0 in Package.swift).
    runs-on: macos-15
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          # Full history so "what changed since the last release" can be
          # computed with git describe + git log.
          fetch-depth: 0

      - name: Build the app bundle + DMG
        run: bash bundle.sh release

      - name: Read version from Info.plist
        id: meta
        run: |
          set -euo pipefail
          SHORT="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' build/Vision.app/Contents/Info.plist)"
          # Pad a short version ("0.4") up to a full dotted one ("0.4.0").
          IFS=. read -r major minor patch <<<"$SHORT"
          major="${major:-0}"; minor="${minor:-0}"; patch="${patch:-0}"
          FULL="$major.$minor.$patch"
          # The release API rejects a *tag name* as target_commitish on this
          # repo, so point it at the peeled commit the tag refers to.
          TARGET="$(git rev-parse "${GITHUB_REF#refs/tags/}^{}")"
          echo "full=$FULL" >> "$GITHUB_OUTPUT"
          echo "tag=v$FULL"   >> "$GITHUB_OUTPUT"
          echo "title=Vision for macOS v$FULL" >> "$GITHUB_OUTPUT"
          echo "target=$TARGET" >> "$GITHUB_OUTPUT"

      - name: Keep the DMG as an artifact
        uses: actions/upload-artifact@v4
        with:
          name: Vision-macOS-${{ steps.meta.outputs.tag }}
          path: build/Vision.dmg
          if-no-files-found: error

      - name: Create / update the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${{ steps.meta.outputs.tag }}"
          # Re-runnable: drop any existing release for this tag (keep the tag,
          # which --target below requires).
          gh release delete "$TAG" --yes 2>/dev/null || true
          # Append "what changed" — the commits since the previous release tag.
          PREV="$(git describe --tags --abbrev=0 "$TAG^" 2>/dev/null || true)"
          NOTES="$(mktemp)"
          cp .github/release_notes.md "$NOTES"
          if [ -n "$PREV" ]; then
            {
              printf '\n## What changed since %s\n\n' "$PREV"
              git log --no-decorate --pretty='- %h %s' "$PREV..$TAG" | sed 's/^/  /'
            } >> "$NOTES"
          fi
          gh release create "$TAG" \
            --title "${{ steps.meta.outputs.title }}" \
            --target "${{ steps.meta.outputs.target }}" \
            --notes-file "$NOTES" \
            build/Vision.dmg
